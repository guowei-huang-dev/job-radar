# ============================================================
# job-radar configuration
# Tune the search scope and filter strictness here — no code changes needed
# ============================================================

sources:
  linkedin:
    enabled: true
    # Each keywords group is searched separately. Fewer keywords are more precise — don't pile them on.
    searches:
      - keywords: "Werkstudent AI"
      - keywords: "Working Student AI"
      - keywords: "Working Student Machine Learning"
      - keywords: "Werkstudent Python"
      - keywords: "Working Student Data Engineer"
      - keywords: "Working Student Automation"
      - keywords: "Werkstudent Softwareentwicklung"
      - keywords: "Working Student Software Engineer"
      - keywords: "Intern LLM"
    location: "Berlin, Germany"
    # Time window: r + seconds. Use the second count for however many days you want.
    #   r86400  = last 1 day
    #   r259200 = last 3 days
    #   r604800 = last 7 days (largest sample — use on a first run, or to gauge posting density)
    time_filter: "r259200"
    max_pages: 4            # Max pages per keyword group (25 postings per page)
    request_delay: [3, 6]   # Random sleep range in seconds between requests — do not lower
    max_retries: 3

  arbeitnow:
    # Fully sanctioned public JSON API, used as a supplement to LinkedIn
    enabled: true
    pages: 3
    keywords: ["werkstudent", "working student", "intern", "praktikum"]

filters:
  # The title must contain at least one of these (case-insensitive). Leave empty for no restriction.
  title_must_include:
    - werkstudent
    - working student
    - student assistant
    - praktikum
    - praktikant
    - intern
    - internship
    - entry level
    - junior

  # Drop the posting if the title contains any of these
  title_exclude:
    - sales
    - vertrieb
    - marketing
    - recruit
    - human resources
    - hr
    - talent acquisition
    - accounting
    - buchhaltung
    - steuer
    - legal
    - customer support
    - kundenservice
    - social media
    - content creator
    - grafik
    - pflege

  # The location must contain at least one of these. Leave empty for no restriction.
  location_must_include:
    - berlin
    - remote
    - deutschland
    - germany

  # true  = rules only tag; every posting still gets its description fetched and scored
  #         — nothing slips through, but it costs more time and tokens
  # false = a rule hit drops the posting immediately, with no fetch and no scoring
  #         — cheaper and faster
  score_everything: true

  german:
    # The setting below only takes effect when score_everything is false
    # required  → German is explicitly required, drop it
    # optional  → German is only a nice-to-have, keep it
    # unclear   → German is mentioned but the verdict is ambiguous; keep it and let the model re-check
    drop_when_required: true
    # What to do when the whole description is written in German: keep / flag / drop
    # flag = keep it but mark it in the digest (recommended — a German-language JD
    #        is not the same thing as a German-language requirement)
    german_jd_action: flag

scoring:
  # deepseek-flash  = DeepSeek-V4.1-Flash. Cheap, good enough, the default choice.
  # deepseek-v4-pro = Stronger but about 4x the price. Switch if the scoring feels imprecise.
  model: "deepseek-flash"
  # DeepSeek officially recommends 1.0 for "data analysis" style tasks;
  # drop to 0.3 if you want more stable scores
  temperature: 1.0
  # Postings below this score stay out of the digest
  min_score_to_report: 55
  # Max postings scored in a single run (cost gate — the overflow waits for the next run).
  # Raise this when score_everything is true, otherwise a backlog builds up faster than it clears.
  max_jobs_per_run: 400

report:
  title: "Daily Job Radar"
  timezone: "Europe/Berlin"
  # Max entries listed in the digest
  max_items: 25
  # Send the email even when there are no results (false = send nothing when empty)
  send_when_empty: false
