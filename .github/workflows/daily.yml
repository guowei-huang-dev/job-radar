name: daily job radar

# Scheduled runs are disabled on purpose.
# GitHub Actions egress IPs sit in Azure datacenter ranges, which LinkedIn
# throttles far more aggressively than residential connections — a scheduled
# run took 43 minutes and returned nothing. See "Option 2: GitHub Actions"
# in the README. Kept here as a manual-trigger path for when the laptop is away.
#
# Note that results are not persisted back to the repository: jobs.db and
# reports/ are gitignored, so a run on a public repo can only deliver the
# email digest. Persisting state requires a private repo and an explicit
# commit step.
on:
  workflow_dispatch:          # manual trigger from the Actions tab

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run radar
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -m radar.cli run
